<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/webp" href="/logo.webp" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#0c1970" />

    <title>Signature Sports | Premium Sports Gear in Kallambalam</title>
    <meta
      name="description"
      content="Signature Sports is Kallambalam's premier sports store offering top-quality football boots, athletic shoes, sports balls, racquets, board games, and fitness gear."
    />
    <meta
      name="keywords"
      content="Signature Sports, Signature Sports Kallambalam, sports store Kerala, football boots Kallambalam, badminton racquets, sports shop Kallambalam"
    />
    <meta name="author" content="Signature Sports" />
    <link rel="canonical" href="https://signature-sports.onrender.com/" />

    <!-- Open Graph for social sharing -->
    <meta property="og:type" content="website" />
    <meta property="og:title" content="Signature Sports | Kallambalam's Premier Sports Store" />
    <meta property="og:description" content="Discover premium sports gear, athletic shoes, footballs, racquets, and accessories at Signature Sports in Kallambalam." />
    <meta property="og:image" content="https://signature-sports.onrender.com/logo.webp" />
    <meta property="og:url" content="https://signature-sports.onrender.com/" />
    <meta name="twitter:card" content="summary_large_image" />

    <!-- Structured Data (JSON-LD) for Local Business / Sports Store -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "SportingGoodsStore",
        "name": "Signature Sports",
        "image": "https://signature-sports.onrender.com/logo.webp",
        "url": "https://signature-sports.onrender.com/",
        "telephone": "+917034546546",
        "address": {
          "@type": "PostalAddress",
          "addressLocality": "Kallambalam",
          "addressRegion": "Kerala",
          "addressCountry": "IN"
        },
        "geo": {
          "@type": "GeoCoordinates",
          "latitude": 8.763725,
          "longitude": 76.792335
        },
        "openingHoursSpecification": {
          "@type": "OpeningHoursSpecification",
          "dayOfWeek": [
            "Monday",
            "Tuesday",
            "Wednesday",
            "Thursday",
            "Friday",
            "Saturday",
            "Sunday"
          ],
          "opens": "09:00",
          "closes": "21:00"
        },
        "priceRange": "₹₹"
      }
    </script>

    <!-- Google Fonts: Inter (UI/Body) & Kanit + Oswald (Sports Headings) — non-blocking -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <!-- Preload the font CSS so the browser discovers it early without blocking render -->
    <link
      rel="preload"
      as="style"
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Kanit:wght@600;700;800&family=Oswald:wght@600;700&display=swap"
      onload="this.onload=null;this.rel='stylesheet'"
    />
    <noscript>
      <link
        href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Kanit:wght@600;700;800&family=Oswald:wght@600;700&display=swap"
        rel="stylesheet"
      />
    </noscript>

    <!-- Bootstrap 5 CSS is now bundled locally via npm (no CDN round-trip) -->
  </head>
  <body>
    <div id="root"></div>

    <!-- FontAwesome -->
    <script
      src="https://kit.fontawesome.com/5141f92ced.js"
      crossorigin="anonymous"
      defer
    ></script>

    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
